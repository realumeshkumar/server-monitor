# /etc/nginx/sites-available/monitor.realumeshkumar.in
# Copy the listen / ssl lines from your working realumeshkumar.in block
# so this one matches how the Cloudflare Tunnel reaches Nginx.
server {
    listen 80;
    server_name monitor.realumeshkumar.in;

    # API and live streams go straight to FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;        # needed for live (SSE) data
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Everything else is the Next.js dashboard
    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
